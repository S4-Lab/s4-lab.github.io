<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Publications - S4 Lab</title>
    <link rel="stylesheet" href="css/style.css?v=18">
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="container">
            <div class="nav-brand">
                <a href="index.html"><img src="img/color_logo.png" alt="S4 Lab" class="nav-logo"></a>
            </div>
            <ul class="nav-menu">
                <li><a href="index.html">Home</a></li>
                <li><a href="research.html">Research</a></li>
                <li><a href="people.html">People</a></li>
                <li><a href="publications.html" class="active">Publications</a></li>
                <li><a href="support.html">Support</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
            <div class="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    </nav>

    <!-- Page Header -->
    <section class="page-header">
        <div class="container">
            <h1>Publications</h1>
        </div>
    </section>

    <!-- Filter Controls -->
    <section class="pub-filter-section">
        <div class="container">
            <div class="filter-controls">
                <div class="filter-row">
                    <span class="filter-label">Year</span>
                    <div class="filter-buttons">
                        <button class="filter-btn active" data-filter="all">All</button>
                        <button class="filter-btn" data-filter="2025">2025</button>
                        <button class="filter-btn" data-filter="2024">2024</button>
                        <button class="filter-btn" data-filter="2023">2023</button>
                        <button class="filter-btn" data-filter="2022">2022</button>
                        <button class="filter-btn" data-filter="older">Older</button>
                    </div>
                </div>
                <div class="filter-row">
                    <span class="filter-label">Type</span>
                    <div class="filter-buttons" id="typeFilters">
                        <button class="type-btn active" data-type="all">All</button>
                        <button class="type-btn" data-type="paper">Journal &amp; Conference</button>
                        <button class="type-btn" data-type="demo">Demo</button>
                        <button class="type-btn" data-type="workshop">Workshop</button>
                        <button class="type-btn" data-type="patent">Patent</button>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Publications List -->
    <section class="publications-section">
        <div class="container">
            <div id="publications-container"></div>
        </div>
    </section>

    <script src="js/publications.js?v=15"></script>
</body>
</html>
